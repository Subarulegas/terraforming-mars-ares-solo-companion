<meta name="theme-color" content="#1e0d09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ares Solo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: companheiro de mesa, curto e firme, como um painel de missão
   IDEA: o painel de bordo da corporação — tabuleiro de Marte + cartas de fase
   PICTURE: três medidores de Marte (temperatura, oxigênio, oceanos) no topo, vivos
   COLOUR: chão marciano ferrugem profundo, areia como apoio, ciano-oceano como acento
   TYPE/LAYOUT: Chakra Petch nos títulos, Inter no texto; coluna única de celular */
:root{color-scheme:light dark;
--bg:light-dark(#f4e6d4,#1e0d09);--panel:light-dark(#fff8ef,#2e1610);--line:light-dark(#e2c9ab,#4a271c);
--ink:light-dark(#2b120b,#f5e6d6);--mute:light-dark(#7a5443,#c39f8a);
--rust:light-dark(#b8401f,#e0592f);--sand:light-dark(#c98a4b,#d9a066);--sea:light-dark(#0f8fa6,#38c6dc);--ok:light-dark(#2f7d3a,#6fd07c);
--cu:light-dark(#b0662f,#d8874a);--ag:light-dark(#8a8f98,#c9ced6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Chakra Petch",Inter,sans-serif;margin:0;line-height:1.05}
h1{font-size:clamp(26px,6vw,36px)}h2{font-size:22px}h3{font-size:17px}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
.top{margin-bottom:12px}.top p{margin:4px 0 0;color:var(--mute);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mars{background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--rust) 35%,transparent),transparent 60%),var(--panel)}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge{text-align:center}.gauge .num{font-size:clamp(24px,7vw,32px)}
small{display:block;color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--line);margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.pm{display:flex;gap:6px;justify-content:center;align-items:center}
button{font:600 16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 14px;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.pm button{min-width:44px;padding:0}
.go{background:var(--rust);border-color:var(--rust);color:#fff;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stat span{font-size:13px;color:var(--mute)}
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ph{display:flex;flex-direction:column;align-items:center;padding:8px 2px;gap:2px;font-size:13px}
.ph b{font:700 20px "Chakra Petch",sans-serif}
.ph.sel,.seg button.sel{background:var(--rust);color:#fff;border-color:var(--rust)}
.tip{font-size:15px;color:var(--mute);margin:10px 0 0}.tip strong{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
.chip.on{border-color:var(--sea);color:var(--sea)}
.step{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step input{width:24px;height:24px;margin-top:2px;accent-color:var(--ok);flex:none}
.step p,.blk p{margin:4px 0 0;font-size:15px}
.bonus{color:var(--sea);font-weight:600}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:12px;background:var(--line);margin-left:6px;vertical-align:middle}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
label.f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
label.f input{font-size:16px;width:90px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;text-align:right}
.big{font:700 clamp(30px,9vw,44px) "Chakra Petch",sans-serif;text-align:center;margin:8px 0}
.win{color:var(--ok)}.lose{color:var(--rust)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px}
.foot .row{max-width:560px;margin:0 auto;justify-content:space-between}
.hand{display:flex;gap:5px}.hand i{width:14px;height:20px;border-radius:3px;border:1.5px solid var(--sand)}.hand i.used{background:var(--sand)}
ul.r{margin:6px 0 0;padding-left:20px;font-size:15px}
.bot{border-left:4px solid var(--sea)}
.cubes{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:18px}
.cubes i{width:14px;height:14px;border-radius:3px}.cubes .ag{background:var(--ag)}.cubes .cu{background:var(--cu)}
.acard{border:2px solid var(--sea);border-radius:12px;padding:14px;text-align:center;margin-top:10px}
.acard .num{font-size:30px}
.blk{padding:12px;border-radius:10px;background:var(--bg);margin-top:10px}
.blk h3{font-size:15px}
.who{font-size:12px;font-weight:600;color:var(--mute)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.cardgrid button{font-size:13px;padding:6px 4px;line-height:1.25}
.cardgrid b{display:block;font:700 18px "Chakra Petch",sans-serif}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.credit{font-size:13px;color:var(--mute);text-align:center;margin-top:6px}.credit a{color:var(--sea)}
.rtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.rtabs button{border:0;background:transparent;font-size:14px;padding:6px 2px}.rtabs button.sel{background:var(--rust);color:#fff}
.flow{margin-top:12px;position:relative}.fl{display:flex;gap:12px;padding-bottom:16px;position:relative}
.fl:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.fn{flex:none;width:36px;height:36px;border-radius:50%;background:var(--rust);color:#fff;display:grid;place-items:center;font:700 17px "Chakra Petch",sans-serif}
.fl p{margin:2px 0 0;font-size:15px;color:var(--mute)}.fl h3{margin-top:7px}
.ex{background:var(--bg);border-radius:12px;padding:12px;margin-top:8px}
.exrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.exc{border-radius:10px;padding:8px 2px;text-align:center;border:2px solid var(--line);font-size:12px}.exc b{display:block;font:700 18px "Chakra Petch",sans-serif}
.exc.you{background:var(--rust);border-color:var(--rust);color:#fff}.exc.opp{border-color:var(--sea);color:var(--sea)}.exc.off{opacity:.4;border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--mute)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.you{background:var(--mute)}.lg.opp{border:2px solid var(--mute)}.lg.off{border:2px dashed var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pill{font-size:14px;padding:6px 10px;border-radius:20px;background:var(--bg)}
.pc{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.pch{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg)}.pch b{font:700 22px "Chakra Petch",sans-serif;color:var(--rust);width:30px}
.pcr{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;padding:8px 12px;border-top:1px solid var(--line)}.pcr p{margin:0;font-size:15px}
.k{font-size:12px;font-weight:600;color:var(--mute);padding-top:2px}.k.bk{color:var(--sea)}.k.ak{color:var(--cu)}
.conv{display:grid;gap:6px;margin-top:8px}.cv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:15px}
.cv strong{text-align:right}.cv.col{flex-direction:column;align-items:flex-start;gap:2px}.cv.col strong{text-align:left}.cv.col span{color:var(--mute);font-size:13px}.arr{color:var(--mute);font-weight:700}
.eco{display:flex;align-items:stretch;gap:6px;margin-top:10px}.eco .arr{align-self:center}
.ec{flex:1;background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;font-size:13px}
.ec strong{font-size:14px}.ec span{color:var(--mute)}.cbs{display:flex;gap:3px;justify-content:center;min-height:16px;flex-wrap:wrap}
.cb{width:14px;height:14px;border-radius:3px;display:inline-block}.cb.cu{background:var(--cu)}.cb.ag{background:var(--ag)}
.stackbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;margin-top:10px}
.react{display:grid;gap:8px;margin-top:10px}.rc{border:2px solid var(--ink);border-radius:12px;padding:10px 12px}.rc p{margin:4px 0 0;font-size:15px}
.cyc{color:var(--ink);margin-top:6px}.cyc svg{width:100%;max-width:340px;display:block;margin:0 auto}
.sc{background:var(--bg);border-radius:12px;padding:12px}.sc p{margin:4px 0 0;font-size:15px}
.tl{margin-top:10px}.tlr{display:flex;align-items:center;gap:8px}.tlh{width:56px;font-size:13px;color:var(--mute);flex:none}
.tls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;flex:1}
.tls i{font-style:normal;text-align:center;font:600 13px Inter,sans-serif;padding:6px 0;border-radius:6px;background:var(--bg)}
.tls i.last{background:var(--sand);color:#2b120b}
.tlb{font-size:12px;color:var(--sea);padding:3px 0 3px 64px}
@media(max-width:400px){.eco{flex-direction:column}.eco .arr{transform:rotate(90deg)}}
.p0{--pc:#3d8f2f}.p1{--pc:#2f6db3;--pc2:#c8322b}.p2{--pc:#2f86d6}.p3{--pc:#d2541f}.p4{--pc:#b89a00}
:root{--pc0:#3d8f2f;--pc1:#2f6db3;--pc1b:#c8322b;--pc2:#2f86d6;--pc3:#d2541f;--pc4:#b89a00}
.exc.you{background:color-mix(in srgb,var(--pc) 22%,transparent);border-color:var(--pc);color:var(--ink)}.exc.opp{border-color:var(--pc);color:var(--ink)}
.pch{border-left:6px solid var(--pc)}.pch b{color:var(--pc)}
.pc.p1 .pch{border-image:linear-gradient(var(--pc) 50%,var(--pc2) 50%) 1}
.acard{border-color:var(--pc,var(--sea))}.acard .num{color:var(--pc,inherit)}
.chip.on[class*=" p"]{border-color:var(--pc);color:var(--pc);font-weight:600}
.blk.ph-on{border:2px solid var(--pc)!important}
.ph{border:2px solid transparent;background:transparent;padding:4px 2px 6px}
.ph img{width:100%;max-width:60px;aspect-ratio:1;display:block;border-radius:10px}
.ph span{font-size:12px;font-weight:600}
.ph.sel{background:color-mix(in srgb,var(--pc) 18%,transparent);border-color:var(--pc);color:var(--ink)}
.ph:disabled img{filter:grayscale(1);opacity:.5}
.exc img{width:100%;max-width:48px;aspect-ratio:1;display:block;margin:0 auto 2px;border-radius:8px}
.exc.off img{filter:grayscale(1);opacity:.5}
.pch img{width:40px;height:40px;border-radius:8px}
.aimg{width:64px;height:64px;border-radius:10px;display:block;margin:0 auto 4px}
img.mini{width:24px;height:24px;border-radius:5px;vertical-align:-6px;margin-right:6px}
.scorebox{margin-top:10px}.ghost{width:100%;background:transparent;border-style:dashed}
.scl{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:baseline;padding:10px 12px;margin-top:8px;border-radius:10px;background:var(--bg)}
.scl strong{font:700 22px "Chakra Petch",sans-serif;text-align:right}.scl small{grid-column:1/-1}
ol.r li{margin-bottom:4px}
.stk{display:grid;gap:10px;margin-top:10px}.stk p.big{margin:6px 0 0;text-align:right;font:700 28px "Chakra Petch",sans-serif}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

wBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23e6c81e%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23b39400%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2296%22%20height%3D%2296%22%20rx%3D%2214%22%20fill%3D%22url%28%23g%29%22/%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2296%22%20height%3D%2296%22%20rx%3D%2214%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-opacity%3D%22.25%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M8%2050H92M50%208V22M50%2078V92%22%20stroke%3D%22%23000%22%20stroke-opacity%3D%22.18%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2230%22%20fill%3D%22%23fff%22%20fill-opacity%3D%22.12%22/%3E%3Cpath%20d%3D%22M6%206l14%204-4%2010zM94%206l-14%204%204%2010zM6%2094l14-4-4-10zM94%2094l-14-4%204-10z%22%20fill%3D%22%23000%22%20fill-opacity%3D%22.22%22/%3E%3Ctext%20x%3D%2250%22%20y%3D%2251%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%20font-family%3D%22Arial%20Black%2CArial%2CHelvetica%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2262%22%20fill%3D%22%23fffbe8%22%20stroke%3D%22%23000%22%20stroke-opacity%3D%22.25%22%20stroke-width%3D%221.5%22%20letter-spacing%3D%22-2%22%3EV%3C/text%3E%3C/svg%3E"];
const TG={oxy:"Oxigênio",temp:"Temperatura",ocean:"Oceano"};
const CARDS=[[1,3,"oxy"],[2,3,"temp"],[3,3,"ocean"],[4,2,"oxy"],[5,2,"temp"],[6,2,"ocean"],[7,0,"oxy"],[8,0,"temp"],[9,0,"ocean"],[10,1,"oxy"],[11,1,"temp"],[12,4,"ocean"],[13,"Espelho","oxy"],[14,"Oportunista","temp"],[15,"Corrida","low"]];
const DIFF={novato:{t:"Novato",s:2},avancado:{t:"Avançado",s:1},especialista:{t:"Especialista",s:0}};
const LV=["Muito fácil","Fácil","Normal","Difícil","Muito difícil"];
const KEY="aresSolo.v2";
let S,hist=[],showRules=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({screen:"setup",mode:"solo",diff:"avancado",lvl:3,deckSrc:"app",round:1,last:null,remain:[0,1,2,3,4],choice:null,dummy:null,done:{},
 temp:-30,o2:0,oc:0,tr:5,forest:0,cards:0,bonusLeft:0,
 a:{c:0,eng:3,vp:0,tr:5,fin:0},deck:shuffle(CARDS.map(c=>c[0])),card:null,aph:null,atg:null,why:"",queue:[],qi:0,msg:[]});
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>60)hist.shift()};
const set=f=>{snap();f();save();draw()};
const AUT=()=>S.mode==="automa";
const hand=()=>Math.ceil(S.round/5);
const tStep=()=>(S.temp+30)/2;
const left=()=>(19-tStep())+(14-S.o2)+(9-S.oc);
const done=()=>S.temp>=8&&S.o2>=14&&S.oc>=9;
const isMax=t=>t==="oxy"?S.o2>=14:t==="temp"?S.temp>=8:S.oc>=9;
const effT=t=>{const o=["oxy","temp","ocean"],i=o.indexOf(t);for(let k=0;k<3;k++){const x=o[(i+k)%3];if(!isMax(x))return x}return t};
const least=()=>{const f=[["oxy",S.o2/14],["temp",tStep()/19],["ocean",S.oc/9]];let b=f[0];for(const x of f)if(x[1]<b[1])b=x;return b[0]};
const ag=c=>Math.floor(c/5);
const app=document.getElementById("app");

/* fase e alvo de uma carta automa, no estado atual */
function cardRes(n){
 const c=CARDS[n-1];let ph=c[1],tg=c[2],why="";
 if(c[1]==="Espelho"){if(S.last===null){ph=3;why="Primeira rodada: Produção."}else{ph=S.last;why=`Joga a fase que você escolheu na rodada anterior (${PH[S.last].t}). Você também a refaz, sem bônus.`}}
 if(c[1]==="Oportunista"){ph=S.a.c>=5?2:3;why=S.a.c>=5?"Tem prata: vai de Ação.":"Sem prata: vai de Produção."}
 if(c[1]==="Corrida"){ph=2;tg=least();why="Alvo: o parâmetro menos avançado."}
 return{ph,tg,why,react:typeof c[1]==="string"?c[1]:null};
}
const pool=()=>S.deck.length?S.deck:CARDS.map(c=>c[0]);
function takeCard(n){
 if(!S.deck.length)S.deck=shuffle(CARDS.map(c=>c[0]));
 S.deck=S.deck.filter(x=>x!==n);S.card=n;
 const r=cardRes(n);S.aph=r.ph;S.atg=r.tg;S.why=r.why;
 S.queue=[...new Set([S.choice,r.ph])].sort();S.qi=0;S.msg=[];S.screen="resolve";
}
/* efeito do automa numa fase revelada */
function botPhase(i){
 const a=S.a,m=[];a.c+=1;m.push("+1 cobre");
 if(i===0){if(a.c>=5){a.c-=5;a.eng++;m.push(`gastou 1 prata: produção ${a.eng}`)}else m.push("sem prata, não sobe a produção")}
 if(i===1){a.vp++;m.push(`pilha de PV ${a.vp}`)}
 if(i===3){a.c+=a.eng;m.push(`+${a.eng} cobres da produção`)}
 if(i===2){const ups=[];
  while(a.c>=5&&!done()){const t=effT(S.atg);a.c-=5;a.tr++;
   if(t==="oxy")S.o2++;else if(t==="temp")S.temp+=2;else{S.oc++;a.c+=1}
   ups.push(t)}
  if(ups.length){const cnt={};ups.forEach(t=>cnt[t]=(cnt[t]||0)+1);
   m.push("subiu "+Object.entries(cnt).map(([t,k])=>`${TG[t]} ${k}×`).join(", ")+` (+${ups.length} IT)`);
   if(cnt.ocean)m.push(`vire ${cnt.ocean} oceano(s) para ele; o bônus impresso vale só 1 cobre (já somado)`)}
  else m.push("sem prata para gastar")}
 return m.join(" · ");
}
function botText(i){
 if(i!==2)return PH[i].bot;
 const t=effT(S.atg);return `${PH[2].bot} Alvo: <strong>${TG[t]}</strong>${t!==S.atg?` (${TG[S.atg]} está no máximo)`:""}. Hoje: ${ag(S.a.c+1)} prata.`;
}

function mars(){
 const g=(lab,val,unit,pct,col,k,sub)=>`<div class="gauge"><small>${lab}</small><div class="num">${val}${unit}</div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div><small>${sub}</small>
 <div class="pm" style="margin-top:6px"><button data-p="${k}" data-d="-1" aria-label="Diminuir ${lab}">−</button><button data-p="${k}" data-d="1" aria-label="Aumentar ${lab}">+</button></div></div>`;
 const rl=Math.max(0,25-S.round+(S.screen==="setup"?1:0)),need=left();
 const third=AUT()?`<span>Para terraformar</span><b class="num" style="font-size:24px">${need}</b><span>níveis faltando</span>`:`<span>Ritmo</span><b class="num" style="font-size:24px">${need?(rl?(need/rl).toFixed(1):"—"):"✓"}</b><span>níveis/rodada</span>`;
 const me=S.tr+S.forest,bot=S.a.tr+S.a.vp;
 const score=S.screen==="setup"||S.screen==="over"?"":`<div class="scorebox"><button class="ghost" id="score" aria-expanded="${!!S.showScore}">${S.showScore?"Ocultar pontuação atual":"Mostrar pontuação atual"}</button>
 ${S.showScore?`<div class="scl"><span>Você</span><strong>${me} PV</strong><small>${S.tr} IT + ${S.forest} de florestas · sem as cartas</small></div>${AUT()?`<div class="scl"><span>Automa</span><strong>${bot} PV</strong><small>${S.a.tr} IT + ${S.a.vp} na pilha de PV</small></div>`:""}`:""}</div>`;
 return `<section class="card mars"><div class="g">
 ${g("Temperatura",(S.temp>0?"+":"")+S.temp,"°C",tStep()/19*100,"var(--rust)","temp",`${19-tStep()} níveis`)}
 ${g("Oxigênio",S.o2,"%",S.o2/14*100,"var(--sand)","o2",`${14-S.o2} níveis`)}
 ${g("Oceanos",S.oc,"/9",S.oc/9*100,"var(--sea)","oc",`${9-S.oc} restantes`)}
 </div>
 <div class="stats">
 <div class="stat"><span>Seu IT</span><div class="pm"><button data-p="tr" data-d="-1" aria-label="Diminuir IT">−</button><b class="num" style="font-size:24px">${S.tr}</b><button data-p="tr" data-d="1" aria-label="Aumentar IT">+</button></div></div>
 <div class="stat"><span>Florestas</span><div class="pm"><button data-p="forest" data-d="-1" aria-label="Diminuir florestas">−</button><b class="num" style="font-size:24px">${S.forest}</b><button data-p="forest" data-d="1" aria-label="Aumentar florestas">+</button></div><span>1 PV cada</span></div>
 <div class="stat">${third}</div>
 </div>
 <p class="tip">Os botões + são para os <strong>seus</strong> aumentos (cada nível dá +1 no seu IT).${AUT()?" Os do automa o app aplica sozinho.":""}</p>${score}</section>`;
}

function botBoard(){
 if(!AUT()||S.screen==="setup")return "";
 const a=S.a,cub=`${'<i class="ag"></i>'.repeat(ag(a.c))}${'<i class="cu"></i>'.repeat(a.c%5)}`;
 const ed=(k,l)=>`<div class="stat"><span>${l}</span><div class="pm"><button data-a="${k}" data-d="-1" aria-label="Diminuir ${l}">−</button><b class="num" style="font-size:20px">${a[k]}</b><button data-a="${k}" data-d="1" aria-label="Aumentar ${l}">+</button></div></div>`;
 return `<section class="card bot"><div class="row" style="justify-content:space-between"><h2>Tabuleiro do automa</h2><small>${LV[S.lvl-1]}</small></div>
 <div class="g" style="margin-top:12px;text-align:center">
 <div><small>Reserva</small><div class="num" style="font-size:22px">${ag(a.c)} <span style="color:var(--ag)">prata</span></div><small>+ ${a.c%5} cobre</small><div class="cubes" style="margin-top:6px">${cub}</div></div>
 <div><small>Produção</small><div class="num" style="font-size:28px">${a.eng}</div><small>cobres na fase IV</small></div>
 <div><small>IT do automa</small><div class="num" style="font-size:28px">${a.tr}</div><small>Pilha de PV: ${S.showScore?a.vp:"oculta"}</small></div></div>
 <details style="margin-top:10px"><summary>Corrigir valores</summary><div class="stats" style="border:0;margin-top:4px">${ed("c","Cobres (total)")}${ed("eng","Produção")}${ed("vp","Pilha de PV")}${ed("tr","IT do automa")}</div></details></section>`;
}

function setup(){
 const solo=!AUT();
 return `<section class="card"><h2>Preparação</h2>
 <h3 style="margin:14px 0 8px">Modo</h3>
 <div class="seg" style="grid-template-columns:1fr 1fr"><button data-mode="solo" class="${solo?"sel":""}">Solo oficial</button><button data-mode="automa" class="${solo?"":"sel"}">Automa Híbrido</button></div>
 <p class="tip">${solo?"Terraforme Marte sozinho em 25 rodadas, com a mão do automa.":"Um rival que pontua: ganha cubos, aumenta a produção e terraforma Marte para ele. Vence quem fizer mais PV."}</p>
 <ul class="r" style="margin-top:12px"><li>Monte o jogo normalmente: 2 corporações (fique com 1), 8 cartas de projeto, tabuleiro em −30 °C, 0% e 9 oceanos virados.</li>
 ${solo?`<li>Separe um 2º conjunto de cartas de fase: é a mão do automa (a “mão marciana” do manual).</li><li>Cubo de cor livre no espaço 1 da trilha de IT (cubo do automa).</li>`:
 `<li>Dê ao automa um tabuleiro de jogador de outra cor, marcador de IT no 5 e o marcador de produção de M$ no valor do nível.</li><li>Reserva (área de M$) e pilha de PV (área de plantas) começam vazios. Ele não recebe corporação nem cartas.</li><li>Use cubos para cobre e prata (5 cobres = 1 prata). O app também acompanha tudo.</li>`}</ul>
 <h3 style="margin:16px 0 8px">${solo?"Dificuldade":"Nível (produção inicial)"}</h3>
 ${solo?`<div class="seg">${Object.entries(DIFF).map(([k,v])=>`<button data-diff="${k}" class="${S.diff===k?"sel":""}">${v.t}</button>`).join("")}</div>
 <p class="tip">${S.diff==="novato"?"Sempre que a mão do automa for reembaralhada: +2 níveis de oxigênio/temperatura.":S.diff==="avancado"?"Sempre que a mão do automa for reembaralhada: +1 nível de oxigênio/temperatura.":"Sem bônus. Só você contra o relógio."}</p>`:
 `<div class="seg" style="grid-template-columns:repeat(5,minmax(0,1fr))">${LV.map((l,i)=>`<button data-lvl="${i+1}" class="${S.lvl===i+1?"sel":""}" aria-label="${l}"><b class="num" style="font-size:18px">${i+1}</b></button>`).join("")}</div>
 <p class="tip"><strong>${LV[S.lvl-1]}</strong>: o automa começa com produção ${S.lvl}.</p>`}
 <h3 style="margin:16px 0 8px">${solo?"Mão do automa":"Cartas do automa"}</h3>
 <div class="seg" style="grid-template-columns:1fr 1fr"><button data-src="app" class="${S.deckSrc==="app"?"sel":""}">App sorteia</button><button data-src="fis" class="${S.deckSrc==="fis"?"sel":""}">Cartas físicas</button></div>
 ${!solo&&S.deckSrc==="fis"?`<p class="tip">Use as 15 cartas impressas do automa; a cada rodada você toca no número da carta revelada.</p>`:""}
 <button class="go" id="start" style="margin-top:18px">Começar rodada 1</button>
 ${solo?"":`<p class="credit">Automa Híbrido v0.6 por manufitoussi · <a href="https://github.com/manufitoussi/ares-solo-automa">regras originais</a> · CC BY-NC-SA 4.0 · esta adaptação segue a mesma licença</p>`}</section>`;
}

function head(){
 const used=5-S.remain.length;
 return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h2>Rodada ${S.round}${AUT()?"":`<span style="color:var(--mute);font-size:16px"> / 25</span>`}</h2>
 <p class="tip" style="margin-top:4px">${AUT()?`Automa: ${S.deck.length||15} cartas no baralho · ${LV[S.lvl-1]}`:`Mão ${hand()} do automa · cubo no espaço ${hand()} · ${DIFF[S.diff].t}`}</p></div>
 ${AUT()?"":`<div class="hand" title="Cartas do automa usadas nesta mão">${[0,1,2,3,4].map(i=>`<i class="${i<used?"used":""}"></i>`).join("")}</div>`}</div>`;
}

function forecast(){
 const p=pool(),cnt=[0,0,0,0,0];p.forEach(n=>cnt[cardRes(n).ph]++);
 const pc=i=>Math.round(cnt[i]/p.length*100);
 const best=[0,1,2,3,4].filter(i=>i!==S.last).sort((x,y)=>cnt[x]-cnt[y])[0];
 return `<p class="tip" style="margin-top:12px">Chance de o automa revelar cada fase (${p.length} cartas no baralho):</p>
 <div class="chips">${PH.map((f,i)=>`<span class="chip p${i} ${cnt[i]?"on":""}">${f.n} ${f.t} ${pc(i)}%</span>`).join("")}</div>
 <p class="tip">Cada fase revelada dá 1 cobre ao automa. <strong>Coincidir com a fase dele</strong> corta 1 cobre dele, mas você fica com uma fase só. Fase menos provável dele agora: <strong>${PH[best].n} ${PH[best].t}</strong>.</p>`;
}

function choose(){
 let info;
 if(AUT())info=forecast();
 else{
  const p=Math.round(100/S.remain.length),safe=[0,1,2,3,4].filter(i=>i!==S.last&&!S.remain.includes(i));let t;
  if(hand()===5)t=`<strong>Mão final:</strong> você escolhe a ordem das cartas do automa. Combine com a sua fase para ganhar a fase que quiser de graça.`;
  else if(S.remain.length===1)t=`<strong>Certeza:</strong> o automa vai revelar ${PH[S.remain[0]].n} ${PH[S.remain[0]].t}. Escolha outra fase para ter 2 fases nesta rodada.`;
  else t=`Cada carta restante tem <strong>${p}%</strong> de sair.${safe.length?` Escolhendo ${safe.map(i=>PH[i].n).join(" ou ")} (fora da mão do automa) você garante 2 fases diferentes.`:""}`;
  info=`<p class="tip" style="margin-top:12px">O automa ainda pode revelar:</p><div class="chips">${PH.map((f,i)=>`<span class="chip p${i} ${S.remain.includes(i)?"on":""}">${f.n} ${f.t}${S.remain.includes(i)?"":" ✕"}</span>`).join("")}</div><p class="tip">${t}</p>`;
 }
 const btn=AUT()?(S.deckSrc==="app"?"Revelar carta do automa":"Informar carta do automa"):hand()===5?"Escolher carta do automa":S.deckSrc==="app"?"Revelar carta do automa":"Informar carta do automa";
 return `<section class="card">${head()}<h3>1 · Escolha a sua fase</h3>
 <div class="phases" style="margin-top:10px">${PH.map((f,i)=>`<button class="ph p${i} ${S.choice===i?"sel":""}" data-ch="${i}" ${i===S.last?"disabled":""} aria-label="${f.n} ${f.t}"><img src="${PHIMG[i]}" alt=""><span>${f.t.slice(0,5)}.</span></button>`).join("")}</div>
 ${S.last!==null?`<p class="tip">${PH[S.last].n} bloqueada: você jogou ${PH[S.last].t} na rodada anterior.</p>`:""}
 ${info}${advice()}
 <button class="go" id="lock" style="margin-top:14px" ${S.choice===null?"disabled":""}>${btn}</button></section>`;
}

function advice(){
 const a=[];
 if(AUT()){
  const me=S.tr+S.forest,bot=S.a.tr+S.a.vp;
  if(S.showScore)a.push(`Pontuação atual (sem as cartas): você ${me} × automa ${bot}.`);
  if(ag(S.a.c)>=2)a.push(`O automa tem ${ag(S.a.c)} prata guardada: se a fase Ação for revelada, ele sobe ${ag(S.a.c)}+ níveis de uma vez.`);
  a.push("Ele só acelera o fim do jogo. Se você está atrás nos pontos, evite revelar Ação (a sua ou a dele) e ganhe tempo com cartas de PV. Se está na frente, terraforme rápido para fechar a partida.");
 }else{
  const rl=26-S.round,r=left()/rl;
  if(r>1.8)a.push("Você está <strong>atrasado</strong> na terraformação: priorize Ação (conversões e projetos-padrão) e cartas que sobem parâmetros.");
  else if(S.round<=8)a.push("Começo de jogo: invista em produção (cartas verdes) e em cartas; a produção rende por mais rodadas.");
  else if(S.round>=20)a.push("Reta final: cartas de produção quase não rendem mais. Converta tudo em parâmetros.");
 }
 a.push("Mão pequena (≤3 cartas)? Pesquisa. Muito M$ parado? Construção ou Ação. Pouco M$? Produção (+4 M$ de bônus).");
 return `<details style="margin-top:10px"><summary>Me ajude a decidir</summary><ul class="r">${a.map(x=>`<li>${x}</li>`).join("")}</ul></details>`;
}

 <div class="cardgrid">${pool().slice().sort((x,y)=>x-y).map(n=>{const c=CARDS[n-1];return `<button data-cd="${n}"><b>${n}</b>${typeof c[1]==="string"?c[1]:PH[c[1]].n+" "+PH[c[1]].t.slice(0,6)+"."}</button>`}).join("")}</div></section>`;

 return `<section class="card">${head()}<h3>2 · ${lab}</h3><p class="tip">Você escolheu ${PH[S.choice].n} ${PH[S.choice].t}.</p>
 <div class="phases" style="margin-top:10px">${S.remain.map(i=>`<button class="ph p${i}" data-dm="${i}" aria-label="${PH[i].n} ${PH[i].t}"><img src="${PHIMG[i]}" alt=""><span>${PH[i].t.slice(0,5)}.</span></button>`).join("")}</div></section>`;
}

function resolveSolo(){
 const act=[...new Set([S.choice,S.dummy])].sort(),same=S.choice===S.dummy;
 return `<section class="card">${head()}<h3>3 · Resolva as fases em ordem</h3>
 <p class="tip">O automa revelou <strong>${PH[S.dummy].n} ${PH[S.dummy].t}</strong>${same?" — a mesma fase que você. Só ela acontece nesta rodada.":" (sem bônus)."}</p>
 ${act.map(i=>`<label class="step"><input type="checkbox" data-dn="${i}" ${S.done[i]?"checked":""}><div><h3><img src="${PHIMG[i]}" alt="" class="mini">${PH[i].n} · ${PH[i].t}${i===S.choice?'<span class="tag">sua</span>':""}</h3>
 <p>${PH[i].base}</p>${PH[i].std?`<p>${PH[i].std}</p>`:""}${i===S.choice?`<p class="bonus">Bônus: ${PH[i].bon}</p>`:""}${PH[i].end?`<p><strong>Atenção:</strong> ${PH[i].end}</p>`:""}</div></label>`).join("")}
 <div class="step" style="border-top:1px solid var(--line)"><div><h3>Fim da rodada</h3><p>Fique com no máximo 10 cartas na mão, descartando as excedentes; cada carta descartada assim dá 3 M$. Vire as peças de fase para o lado da porta fechada.</p></div></div>
 ${done()?`<p class="tip win"><strong>Marte está terraformado!</strong> Termine a fase atual e passe para a pontuação final.</p>`:""}
 <button class="go" id="next" style="margin-top:8px">${done()?"Ir para a pontuação final":S.round===25?"Encerrar partida":"Próxima rodada"}</button></section>`;
}

function resolveBot(){
 const c=CARDS[S.card-1],r={ph:S.aph,tg:S.atg};
 const fin=S.qi>=S.queue.length,cur=S.queue[S.qi];
 const cardBox=`<div class="acard p${r.ph}"><img src="${PHIMG[r.ph]}" alt="" class="aimg"><small>Carta ${S.card}/15${typeof c[1]==="string"?" · "+c[1]:""}</small><div class="num">${PH[r.ph].n} ${PH[r.ph].t}</div><small>Alvo: ${TG[r.tg]}</small>${S.why?`<p class="tip" style="margin-top:6px">${S.why}</p>`:""}</div>`;
 const log=S.msg.map(x=>`<div class="blk"><h3>${x[0]} · feito</h3><p class="who">Automa</p><p>${x[1]}</p></div>`).join("");
 let body;
 if(!fin){
  const mine=cur===S.choice;
  body=`<div class="blk ph-on p${cur}"><h3><img src="${PHIMG[cur]}" alt="" class="mini">Fase ${PH[cur].n} · ${PH[cur].t}${mine?'<span class="tag">sua</span>':'<span class="tag">do automa</span>'}</h3>
  <p class="who" style="margin-top:8px">Você${mine?"":" (sem bônus)"}</p><p>${PH[cur].base}</p>${PH[cur].std?`<p>${PH[cur].std}</p>`:""}${mine?`<p class="bonus">Bônus: ${PH[cur].bon}</p>`:""}${PH[cur].end?`<p><strong>Atenção:</strong> ${PH[cur].end}</p>`:""}
  <p class="who" style="margin-top:8px">Automa (nunca tem bônus)</p><p>${botText(cur)}</p>
  ${cur===2?`<p class="tip">Lance os seus aumentos de parâmetro no painel de Marte <strong>antes</strong> de concluir; o automa sobe o que sobrar.</p>`:""}
  <button class="go" id="phdone" style="margin-top:12px">Concluir fase ${PH[cur].n}</button></div>`;
 }else body=`<div class="blk"><h3>Fim da rodada</h3><p>Fique com no máximo 10 cartas na mão, descartando as excedentes (3 M$ por carta). A carta do automa vai para o descarte dele.</p></div>
  <button class="go" id="next" style="margin-top:12px">Próxima rodada</button>`;
 return `<section class="card">${head()}<h3>3 · Resolva as fases em ordem</h3>
 <p class="tip">Você: ${PH[S.choice].n} ${PH[S.choice].t}. ${S.choice===S.aph?"O automa revelou a mesma fase: só ela acontece.":"O automa revelou:"}</p>${cardBox}${log}${body}</section>`;
}

 <p class="tip">Avance o cubo do automa para o espaço ${hand()}. ${hand()===5?"Na última mão, você escolhe a ordem das cartas do automa.":"Embaralhe a mão do automa."}</p>

 <button class="go" id="bdone" style="margin-top:14px" ${S.bonusLeft&&!(S.temp>=8&&S.o2>=14)?"disabled":""}>Seguir para a rodada ${S.round}</button></section>`;

function over(){

 if(AUT()){
  const a=S.a,bot=a.tr+a.vp+a.fin,res=me>bot?["Você venceu!","win"]:me<bot?["O automa venceu","lose"]:["Empate",""];
  return `<section class="card"><h2>Fim do Jogo</h2>
  <p class="tip">Marte está totalmente terraformado: as 9 peças de oceano foram viradas, a temperatura está em +8 °C e o oxigênio em 14%. A partida terminou na rodada ${S.round}.</p>

  <div class="stk"><div class="sc"><p class="who">Você</p>${inputs}<p class="tip">Inclua as cartas com PV variável (*).</p><p class="big" id="tot">${me} PV</p></div>
  <div class="sc"><p class="who">Automa</p><ul class="r"><li>1 PV por IT: ${a.tr}</li><li>1 PV por cubo na pilha de PV: ${a.vp}</li><li>1 PV por prata restante: ${a.fin}</li></ul><p class="big">${bot} PV</p></div></div>
  <p class="tip">As regras do automa não preveem desempate: em caso de empate, a partida termina empatada.</p>
  <button class="go" id="again">Jogar de novo</button></section>`;
 }
 return `<section class="card"><h2>Fim do Jogo</h2>
 <p class="big ${win?"win":"lose"}">${win?"Você venceu!":"Você perdeu"}</p>

  <div class="legend"><span><i class="lg you"></i>sua escolha (com bônus)</span><span><i class="lg opp"></i>revelada pelo automa</span><span><i class="lg off"></i>não acontece</span></div>

  <h3 style="margin-top:18px">6 · Pontuação Final</h3>
  <div class="stk"><div class="sc"><p class="who">Você recebe PV pelos seguintes critérios:</p>${scoreYou}</div>
  <div class="sc"><p class="who">O automa recebe PV pelos seguintes critérios:</p><ol class="r"><li>1 PV por IT.</li><li>1 PV por cubo na pilha de PV.</li><li>1 PV por prata que restar na reserva dele.</li></ol></div></div>
  <p class="tip">O jogador com mais PV vence a partida. As regras do automa não preveem desempate.</p>
  <p class="credit">Automa Híbrido v0.6 por manufitoussi · <a href="https://github.com/manufitoussi/ares-solo-automa">regras originais</a> · CC BY-NC-SA 4.0 · esta adaptação segue a mesma licença</p>`;
 }
 if(S.rtab==="solo"){
  body=`<h2>Solo oficial</h2><p class="tip">O objetivo do modo solo é terraformar completamente Marte antes que o tempo acabe. Todas as regras do jogo são as mesmas, com as exceções abaixo.</p>
  <h3 style="margin-top:18px">Preparação</h3>
  <ol class="r"><li>Separe um conjunto adicional de cartas de fase: é a mão do automa (a “mão marciana” do manual). Embaralhe-as viradas para baixo.</li>
  <li>Coloque um cubo de uma cor que você não esteja usando no espaço 1 da trilha de IT. É o cubo do automa.</li>
  <li>Escolha um nível de dificuldade: Novato, Avançado ou Especialista.</li></ol>
  <h3 style="margin-top:18px">Andamento do jogo</h3>
  <p class="tip">Depois de escolher sua carta de fase, revele a carta do topo da mão do automa. Essa fase também é jogada na rodada, sem bônus.</p>
  <p class="tip">Quando as 5 cartas da mão do automa forem jogadas, embaralhe-as de novo e avance o cubo do automa 1 espaço na trilha de IT. Quando o cubo chegar ao 5, jogue as cinco rodadas finais: nelas, você escolhe a ordem das cartas do automa. Ao todo são 25 rodadas.</p>
  <h3 style="margin-top:18px">Dificuldade</h3>
  <p class="tip">A dificuldade define quanta ajuda você recebe para terraformar. Toda vez que o cubo do automa avança (4 vezes por partida, ao fim das rodadas 5, 10, 15 e 20), você aumenta parâmetros de graça:</p>
  <div class="conv"><div class="cv col"><span>Novato</span><strong>Aumente o oxigênio ou a temperatura 2 vezes (8 níveis grátis na partida)</strong></div>
  <div class="cv col"><span>Avançado</span><strong>Aumente o oxigênio ou a temperatura 1 vez (4 níveis grátis na partida)</strong></div>
  <div class="cv col"><span>Especialista</span><strong>Nenhum bônus é concedido</strong></div></div>
  <p class="tip">Esses aumentos <strong>não</strong> dão IT nem peças de floresta. Se você ainda não tem experiência com o jogo, comece no Novato.</p>
  <h3 style="margin-top:18px">Fim do Jogo</h3>
  <p class="tip">Assim que cinco mãos do automa forem jogadas (25 rodadas), a partida termina. Se as 9 peças de oceano forem viradas e a temperatura e o oxigênio chegarem ao máximo antes disso, termine a fase atual e passe para a pontuação final.</p>
  <h3 style="margin-top:18px">Pontuação Final</h3>
  <p class="tip">Se Marte estiver totalmente terraformado, ou seja, se todos os parâmetros tiverem atingido o nível máximo, você ganha. Caso contrário, você perde. Por fim, some seus PV, tentando alcançar a pontuação mais alta possível:</p>
  ${scoreYou}`;
 }
 return `<section class="card">${nav}<div style="margin-top:16px">${body}</div><button class="go" id="back" style="margin-top:18px">Voltar ao jogo</button></section>`;
}

function draw(){
 const s=S.screen,body=showRules?rulesView():s==="setup"?setup():s==="choose"?choose():s==="pick"?pickCard():s==="resolve"?(AUT()?resolveBot():resolveSolo()):s==="bonus"?bonus():over();
 app.innerHTML=`<header class="top"><h1>Expedição Ares</h1><p>${AUT()?"Guia solo · Automa Híbrido":"Guia do modo solo"}</p></header>${mars()}${botBoard()}${body}`;
 const tot=document.getElementById("tot");
 ["ftr","ffo","fca"].forEach(id=>{const e=document.getElementById(id);if(e)e.oninput=()=>{const k={ftr:"tr",ffo:"forest",fca:"cards"}[id];S[k]=parseInt(e.value)||0;save();
  const me=S.tr+S.forest+S.cards;tot.textContent=me+" PV";
  const r=document.getElementById("res");if(r){const b=S.a.tr+S.a.vp+S.a.fin;r.textContent=me>b?"Você venceu!":me<b?"O automa venceu":"Empate";r.className="big "+(me>b?"win":me<b?"lose":"")}}});
}

function bump(k,d,tr){
 const lim={temp:[-30,8,2],o2:[0,14,1],oc:[0,9,1],tr:[0,99,1],forest:[0,99,1]}[k];
 const v=S[k]+d*lim[2];if(v<lim[0]||v>lim[1])return false;
 S[k]=v;if(tr&&["temp","o2","oc"].includes(k))S.tr=Math.max(0,S.tr+d);return true;
}
function endGame(){S.a.fin=AUT()?ag(S.a.c):0;S.screen="over"}

app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.p)return set(()=>bump(d.p,+d.d,true));
 if(d.a)return set(()=>{S.a[d.a]=Math.max(d.a==="eng"?1:0,S.a[d.a]+ +d.d)});
 if(d.mode)return set(()=>S.mode=d.mode);
 if(d.diff)return set(()=>S.diff=d.diff);
 if(d.lvl)return set(()=>S.lvl=+d.lvl);
 if(d.src)return set(()=>S.deckSrc=d.src);
 if(b.id==="start")return set(()=>{S.a.eng=S.lvl;S.screen="choose"});
 if(d.ch!==undefined)return set(()=>S.choice=+d.ch);
 if(b.id==="lock")return set(()=>{
  if(AUT()){if(S.deckSrc==="app"){if(!S.deck.length)S.deck=shuffle(CARDS.map(c=>c[0]));takeCard(S.deck[S.deck.length-1])}else S.screen="pick";return}
  if(hand()<5&&S.deckSrc==="app")pickDummy(S.remain[Math.floor(Math.random()*S.remain.length)]);else S.screen="pick"});
 if(d.dm!==undefined)return set(()=>pickDummy(+d.dm));
 if(d.cd)return set(()=>takeCard(+d.cd));
 if(b.id==="phdone")return set(()=>{const i=S.queue[S.qi];S.msg.push([PH[i].n+" "+PH[i].t,botPhase(i)]);S.qi++;if(done())endGame()});
 if(b.id==="next")return set(()=>{
  S.last=S.choice;S.choice=null;S.dummy=null;S.done={};S.card=null;S.msg=[];
  if(done()||(!AUT()&&S.round===25)){endGame();return}
  S.round++;
  if(!AUT()&&S.remain.length===0){S.remain=[0,1,2,3,4];S.bonusLeft=DIFF[S.diff].s;S.screen="bonus"}else S.screen="choose"});
 if(d.bn)return set(()=>{if(S.bonusLeft>0&&bump(d.bn,1,false))S.bonusLeft--});
 if(b.id==="bdone")return set(()=>{S.bonusLeft=0;S.screen="choose"});
 if(b.id==="again"){snap();const m=S.mode,l=S.lvl,df=S.diff,src=S.deckSrc;S=fresh();Object.assign(S,{mode:m,lvl:l,diff:df,deckSrc:src});save();draw();return}
 if(b.id==="score")return set(()=>S.showScore=!S.showScore);
 if(d.rt){S.rtab=d.rt;save();draw();return}
 if(b.id==="back"){showRules=false;draw();scrollTo(0,0)}
});
function pickDummy(i){S.dummy=i;S.remain=S.remain.filter(x=>x!==i);S.done={};S.screen="resolve"}
app.addEventListener("change",e=>{const c=e.target;if(c.dataset.dn!==undefined){S.done[c.dataset.dn]=c.checked;save()}});
document.getElementById("undo").onclick=()=>{if(hist.length){S=JSON.parse(hist.pop());save();showRules=false;draw()}};
document.getElementById("rules").onclick=()=>{showRules=!showRules;S.rtab=null;draw();scrollTo(0,0)};
let armed=false;
document.getElementById("reset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Tem certeza?";setTimeout(()=>{armed=false;e.target.textContent="Nova partida"},2500);return}
 armed=false;e.target.textContent="Nova partida";snap();S=fresh();save();showRules=false;draw()};
draw();
}
</script>
</body>
</html>
