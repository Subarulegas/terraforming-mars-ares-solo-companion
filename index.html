<meta name="theme-color" content="#1e0d09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ares Expedition">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: companheiro de mesa, curto e firme, como um painel de missão
   IDEA: o painel de bordo da corporação — tabuleiro de Marte + cartas de fase
   PICTURE: três medidores de Marte (temperatura, oxigênio, oceanos) no topo, vivos
   COLOUR: chão marciano ferrugem profundo, areia como apoio, ciano-oceano como acento
   TYPE/LAYOUT: Chakra Petch nos títulos, Inter no texto; coluna única de celular */
:root{color-scheme:light dark;
--bg:light-dark(#f4e6d4,#1e0d09);--panel:light-dark(#fff8ef,#2e1610);--line:light-dark(#e2c9ab,#4a271c);
--ink:light-dark(#2b120b,#f5e6d6);--mute:light-dark(#7a5443,#c39f8a);
--rust:light-dark(#b8401f,#e0592f);--sand:light-dark(#c98a4b,#d9a066);--sea:light-dark(#0f8fa6,#38c6dc);--ok:light-dark(#2f7d3a,#6fd07c);
--cu:light-dark(#b0662f,#d8874a);--ag:light-dark(#8a8f98,#c9ced6)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Chakra Petch",Inter,sans-serif;margin:0;line-height:1.05}
h1{font-size:clamp(26px,6vw,36px)}h2{font-size:22px}h3{font-size:17px}
main{max-width:560px;margin:0 auto;padding:16px 14px 90px}
.top{margin-bottom:12px}.top p{margin:4px 0 0;color:var(--mute);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mars{background:radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--rust) 35%,transparent),transparent 60%),var(--panel)}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gauge{text-align:center}.gauge .num{font-size:clamp(24px,7vw,32px)}
small{display:block;color:var(--mute);font-size:13px}
.bar{height:8px;border-radius:5px;background:var(--line);margin:6px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.pm{display:flex;gap:6px;justify-content:center;align-items:center}
button{font:600 16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 14px;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.pm button{min-width:44px;padding:0}
.go{background:var(--rust);border-color:var(--rust);color:#fff;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stat span{font-size:13px;color:var(--mute)}

 to:'<span class="to" aria-hidden="true">→</span>'};
const TIC={oxy:"o2",temp:"temp",ocean:"ocean"};
const TG={oxy:"Oxigênio",temp:"Temperatura",ocean:"Oceano"};
const CARDS=[[1,3,"oxy"],[2,3,"temp"],[3,3,"ocean"],[4,2,"oxy"],[5,2,"temp"],[6,2,"ocean"],[7,0,"oxy"],[8,0,"temp"],[9,0,"ocean"],[10,1,"oxy"],[11,1,"temp"],[12,4,"ocean"],[13,"Espelho","oxy"],[14,"Oportunista","temp"],[15,"Corrida","low"]];
const DIFF={novato:{t:"Novato",s:2},avancado:{t:"Avançado",s:1},especialista:{t:"Especialista",s:0}};
const LV=["Muito fácil","Fácil","Normal","Difícil","Muito difícil"];
const KEY="aresSolo.v2";
let S,hist=[],showRules=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({screen:"setup",mode:"solo",diff:"avancado",lvl:3,deckSrc:"app",round:1,last:null,remain:[0,1,2,3,4],choice:null,dummy:null,done:{},
 temp:-30,o2:0,oc:0,tr:5,forest:0,cards:0,bonusLeft:0,
 a:{c:0,eng:3,vp:0,tr:5,fin:0},deck:shuffle(CARDS.map(c=>c[0])),card:null,aph:null,atg:null,why:"",queue:[],qi:0,msg:[]});
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>60)hist.shift()};
const set=f=>{const sc=S.screen,rd=S.round,qi=S.qi;snap();f();save();draw();
 if(S.screen===sc&&S.round===rd&&S.qi===qi)return;
 if(S.screen===sc&&S.round===rd){const c=document.getElementById("cur");if(c){c.scrollIntoView({block:"start",behavior:"instant"});return}}
 const r=document.getElementById("rodada");
 if(sc==="setup"||!r||showRules)scrollTo({top:0,behavior:"instant"});else r.scrollIntoView({block:"start",behavior:"instant"})};
const AUT=()=>S.mode==="automa";
const hand=()=>Math.ceil(S.round/5);
const tStep=()=>(S.temp+30)/2;
const left=()=>(19-tStep())+(14-S.o2)+(9-S.oc);
const done=()=>S.temp>=8&&S.o2>=14&&S.oc>=9;
const isMax=t=>t==="oxy"?S.o2>=14:t==="temp"?S.temp>=8:S.oc>=9;
const effT=t=>{const o=["oxy","temp","ocean"],i=o.indexOf(t);for(let k=0;k<3;k++){const x=o[(i+k)%3];if(!isMax(x))return x}return t};
const least=()=>{const f=[["oxy",S.o2/14],["temp",tStep()/19],["ocean",S.oc/9]];let b=f[0];for(const x of f)if(x[1]<b[1])b=x;return b[0]};
const ag=c=>Math.floor(c/5);
const app=document.getElementById("app");

/* fase e alvo de uma carta automa, no estado atual */
function cardRes(n){
 const c=CARDS[n-1];let ph=c[1],tg=c[2],why="";
 if(c[1]==="Espelho"){if(S.last===null){ph=3;why="Carta reativa Espelho: copia a sua fase da rodada anterior. Como é a 1ª rodada, joga Produção."}else{ph=S.last;why=`Carta reativa Espelho: copia a fase que você escolheu na rodada anterior (${PH[S.last].t}). Você também a refaz, sem bônus.`}}
 if(c[1]==="Oportunista"){ph=S.a.c>=5?2:3;why=S.a.c>=5?"Carta reativa Oportunista: o automa tem prata, então joga Ação.":"Carta reativa Oportunista: o automa não tem prata, então joga Produção."}
 if(c[1]==="Corrida"){ph=2;tg=least();why=`Carta reativa Corrida: joga Ação, mirando o parâmetro mais atrasado de Marte (${TG[tg]}).`}
 return{ph,tg,why,react:typeof c[1]==="string"?c[1]:null};
}
const pool=()=>S.deck.length?S.deck:CARDS.map(c=>c[0]);
function takeCard(n){
 if(!S.deck.length)S.deck=shuffle(CARDS.map(c=>c[0]));
 S.deck=S.deck.filter(x=>x!==n);S.card=n;
 const r=cardRes(n);S.aph=r.ph;S.atg=r.tg;S.why=r.why;
 S.queue=[...new Set([S.choice,r.ph])].sort();S.qi=0;S.msg=[];S.screen="resolve";
}
/* efeito do automa numa fase revelada */
function botPhase(i){
 const a=S.a,g=[],ch=(ic,t)=>`<span class="gch">${t}${ic}</span>`;let note="";
 const gain=i===3?1+a.eng:1,trd=Math.floor((a.c%5+gain)/5);
 a.c+=1;let cu=1;
 if(i===0){if(a.c>=5){a.c-=5;a.eng++;g.push(ch(IC.ag,"−1"),ch(IC.mc,"+1"))}else g.push(ch("","Produção não aumenta"))}
 if(i===1){a.vp++;g.push(ch(IC.forest,"+1"))}
 if(i===3){a.c+=a.eng;cu+=a.eng}
 if(i===2){const cnt={};let n=0;
  while(a.c>=5&&!done()){const t=effT(S.atg);a.c-=5;a.tr++;n++;
   if(t==="oxy")S.o2++;else if(t==="temp")S.temp+=2;else{S.oc++;a.c+=1;cu++}
   cnt[t]=(cnt[t]||0)+1}
  if(n){g.push(ch(IC.ag,`−${n}`));Object.entries(cnt).forEach(([t,k])=>g.push(ch(IC[TIC[t]],`+${k}`)));g.push(ch(IC.it,`+${n}`));
   if(cnt.ocean)note=`<small class="nt">Vire ${cnt.ocean>1?cnt.ocean+" peças de oceano":"a peça de oceano"} para ele.</small>`}}
 if(trd)g.unshift(ch("",`${trd>1?trd+"× ":""}5 ${IC.cu} ${IC.to} 1 ${IC.ag}`));
 g.unshift(ch(IC.cu,`+${cu}`));
 return `<span class="gl">${g.join("")}</span>${note}`;
}

function botText(i){
 const a=S.a,L=x=>`<span class="bl">${x}</span>`,gain=i===3?1+a.eng:1,tr=Math.floor((a.c%5+gain)/5),c=a.c+gain,out=[L(`+${gain} ${IC.cu}`)];
 const trade=()=>{if(tr)out.push(L(`Troque ${tr>1?tr+"× ":""}5 ${IC.cu} ${IC.to} 1 ${IC.ag}`))};
 if(i===0){trade();out.push(ag(c)?L(`Gaste 1 ${IC.ag} ${IC.to} +1 ${IC.mc}`):L(`Não aumenta a produção (não tem prata)`))}
 if(i===1){out.push(L(`+1 ${IC.forest} (1 PV)`));trade()}
 if(i===2){trade();if(!ag(c)){out.push(L(`Não terraforma (não tem prata)`))}else{
  const sv={o2:S.o2,temp:S.temp,oc:S.oc},cnt={};let cc=c,n=0;
  while(cc>=5&&!done()){const t=effT(S.atg);cc-=5;n++;if(t==="oxy")S.o2++;else if(t==="temp")S.temp+=2;else{S.oc++;cc+=1}cnt[t]=(cnt[t]||0)+1}
  S.o2=sv.o2;S.temp=sv.temp;S.oc=sv.oc;
  out.push(L(`Gaste ${n} ${IC.ag} ${IC.to} `+Object.entries(cnt).map(([t,k])=>`+${k} ${IC[TIC[t]]} ${TG[t]}`).join(", ")))}}
 if(i===3||i===4)trade();
 return out.join("");
}

function botStat(big){
 const a=S.a,t=(ic,v,l)=>`<span class="tvi" title="${l}"><b>${v}</b>${ic}</span>`;
 return `<div class="tv sit${big?" big":""}">${t(IC.it,a.tr,"IT")}${t(IC.ag,ag(a.c),"Prata")}${t(IC.cu,a.c%5,"Cobre")}${t(IC.mc,a.eng,"Produção de M$")}${t(IC.forest,a.vp,"PV")}</div>`;
}

function raises(i){
 const open=!!(S.rsOpen&&S.rsOpen[i]);
 const st=(k,lab,icon,val)=>`<div class="stp"><span class="stl"><b>${val}</b>${icon}</span><div class="pm"><button data-p="${k}" data-d="-1" aria-label="Diminuir ${lab}">−</button><button data-p="${k}" data-d="1" aria-label="Aumentar ${lab}">+</button></div></div>`;
 const head=`<button class="rsh" data-rs="${i}" aria-expanded="${open}"><span>Parâmetros de Marte</span><span class="rsv"><span class="tvi"><b>${(S.temp>0?"+":"")+S.temp}°</b>${IC.temp}</span><span class="tvi"><b>${S.o2}%</b>${IC.o2}</span><span class="tvi"><b>${S.oc}/9</b>${IC.ocean}</span><span class="tvi"><b>${S.forest}</b>${IC.forest}</span></span><i class="chev"></i></button>`;
 if(!open)return `<div class="rs">${head}</div>`;
 return `<div class="rs">${head}<div class="rsg">
 ${st("temp","temperatura",IC.temp,(S.temp>0?"+":"")+S.temp+"°")}${st("o2","oxigênio",IC.o2,S.o2+"%")}${st("oc","oceanos",IC.ocean,S.oc+"/9")}${st("forest","florestas",IC.forest,S.forest)}
 </div><small>Cada nível dá +1 no seu ${IC.it} (agora ${S.tr}).</small></div>`;
}

function mars(){
 const g=(lab,val,unit,pct,col,k,sub)=>`<div class="gauge"><small>${lab}</small><div class="num">${val}${unit}</div><div class="bar"><i style="width:${pct}%;background:${col}"></i></div><small>${sub}</small>
 <div class="pm" style="margin-top:6px"><button data-p="${k}" data-d="-1" aria-label="Diminuir ${lab}">−</button><button data-p="${k}" data-d="1" aria-label="Aumentar ${lab}">+</button></div></div>`;
 const rl=Math.max(0,25-S.round+(S.screen==="setup"?1:0)),need=left();
 const third=AUT()?`<div class="srow"><span>Faltam para terraformar</span><b class="num">${need} níveis</b></div>`:`<div class="srow"><span>Ritmo necessário</span><b class="num">${need?(rl?(need/rl).toFixed(1):"—"):"✓"} <small style="display:inline">níveis/rodada</small></b></div>`;
 const me=S.tr+S.forest,bot=S.a.tr+S.a.vp;

 ${S.showScore?`<div class="scl"><span>Você</span><strong>${me} PV</strong><small>${S.tr} IT + ${S.forest} de florestas · sem as cartas</small></div>${AUT()?`<div class="scl"><span>Automa</span><strong>${bot} PV</strong><small>${S.a.tr} IT + ${S.a.vp} de florestas</small></div>`:""}`:""}</div>`;
 const v=(ic,val,lab)=>`<span class="tvi${ic?"":" keep"}"><b>${val}</b>${ic}${lab?`<small>${lab}</small>`:""}</span>`;
 const a=S.a,inGame=S.screen!=="setup"&&S.screen!=="over";
 const edA=(k,l)=>`<div class="srow"><span>${l}</span><div class="pm"><button data-a="${k}" data-d="-1" aria-label="Diminuir ${l}">−</button><b class="num">${a[k]}</b><button data-a="${k}" data-d="1" aria-label="Aumentar ${l}">+</button></div></div>`;
 const rowM=`<button class="trow" id="mtog" aria-expanded="${!!S.showMars}"><span class="tlab">Marte</span><span class="tv">${v(IC.temp,(S.temp>0?"+":"")+S.temp+"°")}${v(IC.o2,S.o2+"%")}${v(IC.ocean,S.oc+"/9")}</span><i class="chev"></i></button>`;
 const rowP=`<button class="trow" id="ptog" aria-expanded="${!!S.showMars}"><span class="tlab">Você</span><span class="tv">${v(IC.it,S.tr)}${v(IC.forest,S.forest)}</span><i class="chev"></i></button>`;
 const rowA=AUT()&&inGame?`<button class="trow" id="atog" aria-expanded="${!!S.showBot}"><span class="tlab">Automa</span><span class="tv">${v(IC.it,a.tr)}${v(IC.ag,ag(a.c))}${v(IC.cu,a.c%5)}${v(IC.mc,a.eng)}${v(IC.forest,a.vp)}</span><i class="chev"></i></button>
 ${S.showBot?`<div class="tpanel"><small>Nível ${LV[S.lvl-1]} · ${ag(a.c)} prata e ${a.c%5} cobre na reserva. Corrija se algo diferir da mesa:</small>${edA("c","Cobres (total)")}${edA("eng","Produção")}${edA("vp","Peças de floresta")}${edA("tr","IT do automa")}</div>`:""}`:"";
 const sum=`<div class="trows">${rowM}${rowP}${S.showMars?"__MP__":""}${rowA}</div>`;
 const panel=`<div class="tpanel"><div class="g">
 ${g("Temperatura",(S.temp>0?"+":"")+S.temp,"°C",tStep()/19*100,"var(--rust)","temp",`${19-tStep()} níveis`)}
 ${g("Oxigênio",S.o2,"%",S.o2/14*100,"var(--sand)","o2",`${14-S.o2} níveis`)}
 ${g("Oceanos",S.oc,"/9",S.oc/9*100,"var(--sea)","oc",`${9-S.oc} restantes`)}
 </div>
 <div class="stats">
 <div class="srow"><span>Seu IT</span><div class="pm"><button data-p="tr" data-d="-1" aria-label="Diminuir IT">−</button><b class="num">${S.tr}</b><button data-p="tr" data-d="1" aria-label="Aumentar IT">+</button></div></div>
 <div class="srow"><span>Peças de floresta <small>1 PV cada</small></span><div class="pm"><button data-p="forest" data-d="-1" aria-label="Diminuir florestas">−</button><b class="num">${S.forest}</b><button data-p="forest" data-d="1" aria-label="Aumentar florestas">+</button></div></div>
 ${third}
 </div>
 <p class="tip">Para corrigir valores. Durante as fases, os seus aumentos aparecem dentro de cada fase.</p></div>`;
 return `<section class="card mars slim">${sum.replace("__MP__",panel)}${score}</section>`;
}

function botBoard(){

 const a=S.a;
 const ed=(k,l)=>`<div class="srow"><span>${l}</span><div class="pm"><button data-a="${k}" data-d="-1" aria-label="Diminuir ${l}">−</button><b class="num">${a[k]}</b><button data-a="${k}" data-d="1" aria-label="Aumentar ${l}">+</button></div></div>`;

}

 const level=solo?`<h3 class="sh">Dificuldade</h3>

 const prep=solo?`<ol class="r prep">${base}<li>Separe as cartas de fase do oponente (mão marciana).</li><li>Coloque um cubo do oponente no espaço 1 da trilha de IT.</li></ol>`:

 <button class="go" id="start" style="margin-top:18px">Começar a partida</button>
 ${solo?"":`<p class="credit">Automa Híbrido v0.6 por manufitoussi · <a href="https://github.com/manufitoussi/ares-solo-automa">regras originais</a> · CC BY-NC-SA 4.0 · esta adaptação segue a mesma licença</p>`}</section>`;
}

function head(){
 const used=5-S.remain.length;
 return `<div class="row" id="rodada" style="justify-content:space-between;margin-bottom:12px;scroll-margin-top:10px"><div><h2>Rodada ${S.round}${AUT()?"":`<span style="color:var(--mute);font-size:16px"> / 25</span>`}</h2>
 <p class="tip" style="margin-top:4px">${AUT()?`Automa: ${S.deck.length||15} cartas no baralho · ${LV[S.lvl-1]}`:`Mão ${hand()} do automa · cubo no espaço ${hand()} · ${DIFF[S.diff].t}`}</p></div>
 ${AUT()?"":`<div class="hand" title="Cartas do automa usadas nesta mão">${[0,1,2,3,4].map(i=>`<i class="${i<used?"used":""}"></i>`).join("")}</div>`}</div>`;
}

function chances(){
 if(AUT()){const p=pool(),cnt=[0,0,0,0,0];p.forEach(n=>cnt[cardRes(n).ph]++);return cnt.map(c=>Math.round(c/p.length*100))}
 if(hand()===5)return null;
 return [0,1,2,3,4].map(i=>S.remain.includes(i)?Math.round(100/S.remain.length):0);
}
function forecast(){
 return `<p class="tip">Lembre: o automa também age na fase que <strong>você</strong> escolher (ganha 1 cobre e aplica o efeito dela).</p>`;
}

function choose(){
 let info;
 if(AUT())info=forecast();
 else{
  const p=Math.round(100/S.remain.length),safe=[0,1,2,3,4].filter(i=>i!==S.last&&!S.remain.includes(i));let t;
  if(hand()===5)t=`<strong>Mão final:</strong> você escolhe a ordem das cartas do automa. Combine com a sua fase para ganhar a fase que quiser de graça.`;
  else if(S.remain.length===1)t=`<strong>Certeza:</strong> o automa vai revelar ${PH[S.remain[0]].n} ${PH[S.remain[0]].t}. Escolha outra fase para ter 2 fases nesta rodada.`;
  else t=safe.length?`Escolhendo ${safe.map(i=>PH[i].n).join(" ou ")} (fora da mão do automa) você garante 2 fases diferentes.`:"";
  info=t?`<p class="tip">${t}</p>`:"";
 }
 const ch=chances();
 const btn=AUT()?(S.deckSrc==="app"?"Revelar carta do automa":"Informar carta do automa"):hand()===5?"Escolher carta do automa":S.deckSrc==="app"?"Revelar carta do automa":"Informar carta do automa";
 return `<section class="card">${head()}<h3>Escolha a sua fase</h3><p class="tip" style="margin-top:2px">Toque duas vezes na fase para escolher e já revelar a carta do automa.</p>
 <div class="phases" style="margin-top:10px">${PH.map((f,i)=>`<button class="ph p${i} ${S.choice===i?"sel":""}" data-ch="${i}" ${i===S.last?"disabled":""} aria-label="${f.n} ${f.t}"><img src="${PHIMG[i]}" alt=""><span>${f.t.slice(0,5)}.</span>${ch?`<small class="chn${ch[i]?"":" z"}">${ch[i]}%</small>`:""}</button>`).join("")}</div>
 ${ch?`<p class="tip" style="margin-top:6px;font-size:13px">% = chance de o automa revelar essa fase${AUT()?` (${pool().length} cartas no baralho)`:""}.</p>`:""}
 ${info}${advice()}
 <button class="go" id="lock" style="margin-top:14px" ${S.choice===null?"disabled":""}>${btn}</button></section>`;
}

function advice(){
 const a=[];
 if(AUT()){
  const me=S.tr+S.forest,bot=S.a.tr+S.a.vp;
  if(S.showScore)a.push(`Pontuação atual (sem as cartas): você ${me} × automa ${bot}.`);
  if(ag(S.a.c)>=2)a.push(`O automa tem ${ag(S.a.c)} prata guardada: se a fase Ação for revelada, ele sobe ${ag(S.a.c)}+ níveis de uma vez.`);
  a.push("Ele só acelera o fim do jogo. Se você está atrás nos pontos, evite revelar Ação (a sua ou a dele) e ganhe tempo com cartas de PV. Se está na frente, terraforme rápido para fechar a partida.");
 }else{
  const rl=26-S.round,r=left()/rl;
  if(r>1.8)a.push("Você está <strong>atrasado</strong> na terraformação: priorize Ação (conversões e projetos-padrão) e cartas que sobem parâmetros.");
  else if(S.round<=8)a.push("Começo de jogo: invista em produção (cartas verdes) e em cartas; a produção rende por mais rodadas.");
  else if(S.round>=20)a.push("Reta final: cartas de produção quase não rendem mais. Converta tudo em parâmetros.");
 }
 a.push("Mão pequena (≤3 cartas)? Pesquisa. Muito M$ parado? Construção ou Ação. Pouco M$? Produção (+4 M$ de bônus).");
 return `<details style="margin-top:10px"><summary>Me ajude a decidir</summary><ul class="r">${a.map(x=>`<li>${x}</li>`).join("")}</ul></details>`;
}

function pickCard(){
 if(AUT())return `<section class="card">${head()}<h3>Qual carta do automa saiu?</h3>
 <p class="tip">Você escolheu ${PH[S.choice].n} ${PH[S.choice].t}. Toque no número da carta.</p>
 <div class="cardgrid">${pool().slice().sort((x,y)=>x-y).map(n=>{const c=CARDS[n-1];return `<button data-cd="${n}"><b>${n}</b>${typeof c[1]==="string"?c[1]:PH[c[1]].n+" "+PH[c[1]].t.slice(0,6)+"."}</button>`}).join("")}</div></section>`;
 const lab=hand()===5?"Escolha qual carta do automa entra agora":"Qual carta o automa revelou?";
 return `<section class="card">${head()}<h3>${lab}</h3><p class="tip">Você escolheu ${PH[S.choice].n} ${PH[S.choice].t}.</p>
 <div class="phases" style="margin-top:10px">${S.remain.map(i=>`<button class="ph p${i}" data-dm="${i}" aria-label="${PH[i].n} ${PH[i].t}"><img src="${PHIMG[i]}" alt=""><span>${PH[i].t.slice(0,5)}.</span></button>`).join("")}</div></section>`;
}

function pair(myPh,botPh,botSub,why){
 const card=(ph,who,sub)=>`<div class="pcard p${ph}"><small class="pw">${who}</small><img src="${PHIMG[ph]}" alt=""><b class="pn">${PH[ph].t}</b><small class="ps">${sub}</small></div>`;
 const mine=card(myPh,"Jogador","Com bônus");
 const bot=card(botPh,"Automa",botSub||"Sem bônus");
 const list=myPh<=botPh?[mine,bot]:[bot,mine];
 return `<div class="pair">${list.join("")}</div>${myPh===botPh?`<p class="tip" style="margin-top:6px">Mesma fase: ela acontece só uma vez.</p>`:""}${why?`<p class="tip" style="margin-top:6px">${why}</p>`:""}`;
}

function resolveSolo(){
 const act=[...new Set([S.choice,S.dummy])].sort(),same=S.choice===S.dummy;
 return `<section class="card">${head()}<h3>Resolva as fases em ordem</h3>
 ${pair(S.choice,S.dummy,"",)}
 ${act.map(i=>`<div class="blk ph-on p${i}${S.done[i]?" dn":""}"><div class="bh"><img src="${PHIMG[i]}" alt="" class="mid"><h3>${PH[i].t}</h3><span class="tag">${i===S.choice&&i===S.dummy?"Jogador e Automa":i===S.choice?"Jogador":"Automa"}</span>
 <label class="ck"><input type="checkbox" data-dn="${i}" ${S.done[i]?"checked":""} aria-label="Fase ${PH[i].n} concluída"></label></div>
 <p>${PH[i].base}</p>${i===S.choice?`<p class="bonus">Bônus: ${PH[i].bon}</p>`:""}${i<=2&&!S.done[i]?raises(i):""}</div>`).join("")}
 <div class="blk"><h3>Fim da rodada</h3><p>Fique com no máximo 10 cartas na mão (3 M$ por carta descartada).</p></div>
 ${done()?`<p class="tip win"><strong>Marte está terraformado!</strong> Termine a fase atual e passe para a pontuação final.</p>`:""}
 <button class="go" id="next" style="margin-top:12px">${done()?"Ir para a pontuação final":S.round===25?"Encerrar partida":"Próxima rodada"}</button></section>`;
}

function resolveBot(){
 const c=CARDS[S.card-1],r={ph:S.aph,tg:S.atg};
 const fin=S.qi>=S.queue.length,cur=S.queue[S.qi];
 const cardBox=pair(S.choice,r.ph,`Carta ${S.card}${typeof c[1]==="string"?" · "+c[1]:""}<br>Alvo: ${IC[TIC[r.tg]]} ${TG[r.tg]}`,S.why);
 const log=S.msg.map(x=>typeof x[0]==="number"?`<div class="lg2 p${x[0]}"><img src="${PHIMG[x[0]]}" alt="" class="mini"><div><small class="lgh">Fase ${PH[x[0]].n} · ${PH[x[0]].t}</small><p class="lgp"><span class="lgw">O automa ganhou</span>${x[1]}</p></div></div>`:`<div class="lg2"><span>${x[0]}: ${x[1]}</span></div>`).join("");
 let body;
 if(!fin){
  const mine=cur===S.choice;
  body=`<div class="blk ph-on p${cur}" id="cur"><div class="bh"><img src="${PHIMG[cur]}" alt="" class="mid"><h3>${PH[cur].t}</h3><span class="tag">${cur===S.choice&&cur===S.aph?"Jogador e Automa":mine?"Jogador":"Automa"}</span></div>
  <p>${PH[cur].base}</p>${mine?`<p class="bonus">Bônus: ${PH[cur].bon}</p>`:""}
  ${cur<=2?raises(cur):""}
  <div class="rs"><p class="who">Automa nesta fase</p><p class="icl">${botText(cur)}</p></div>
  <button class="go" id="phdone" style="margin-top:12px">Concluir fase ${PH[cur].n}</button></div>`;
 }else body=`<div class="blk"><h3>Fim da rodada</h3><p>Fique com no máximo 10 cartas na mão (3 M$ por carta descartada).</p></div>
  <button class="go" id="next" style="margin-top:12px">Próxima rodada</button>`;
 return `<section class="card">${head()}<h3>Resolva as fases em ordem</h3>${cardBox}${log?`<div class="logs">${log}</div><div class="blk"${fin?' id="cur"':""}><h3>Situação do Automa</h3>${botStat(true)}</div>`:""}${body}</section>`;
}

function bonus(){
 return `<section class="card"><h2>Mão do automa reembaralhada</h2>
 <p class="tip">Avance o cubo do automa para o espaço ${hand()}. ${hand()===5?"Na última mão, você escolhe a ordem das cartas do automa.":"Embaralhe a mão do automa."}</p>
 <h3 style="margin-top:14px">Bônus ${DIFF[S.diff].t}: ${S.bonusLeft} nível(is)</h3>
 <p class="tip">Suba oxigênio ou temperatura. Esses aumentos não dão IT nem peças de floresta.</p>
 <div class="row" style="margin-top:10px"><button data-bn="temp" ${S.temp>=8||!S.bonusLeft?"disabled":""}>+ Temperatura</button><button data-bn="o2" ${S.o2>=14||!S.bonusLeft?"disabled":""}>+ Oxigênio</button></div>
 <button class="go" id="bdone" style="margin-top:14px" ${S.bonusLeft&&!(S.temp>=8&&S.o2>=14)?"disabled":""}>Seguir para a rodada ${S.round}</button></section>`;
}

function over(){
 const win=done(),me=S.tr+S.forest+(+S.cards||0);
 const inputs=`<label class="f">1 PV por IT<input type="number" inputmode="numeric" id="ftr" value="${S.tr}"></label>
 <label class="f">PV das peças de floresta<input type="number" inputmode="numeric" id="ffo" value="${S.forest}"></label>
 <label class="f">PV das cartas de projeto<input type="number" inputmode="numeric" id="fca" value="${S.cards}"></label>`;
 if(AUT()){
  const a=S.a,bot=a.tr+a.vp+a.fin,res=me>bot?["Você venceu!","win"]:me<bot?["O automa venceu","lose"]:["Empate",""];
  return `<section class="card"><h2>Fim do Jogo</h2>
  <p class="tip">Marte está totalmente terraformado: as 9 peças de oceano foram viradas, a temperatura está em +8 °C e o oxigênio em 14%. A partida terminou na rodada ${S.round}.</p>
  <h2 style="margin-top:18px">Pontuação Final</h2>
  <p class="big ${res[1]}" id="res">${res[0]}</p><p class="tip" style="text-align:center;margin-top:0">O jogador com mais PV vence a partida.</p>
  <div class="stk"><div class="sc"><p class="who">Você</p>${inputs}<p class="tip">Inclua as cartas com PV variável (*).</p><p class="big" id="tot">${me} PV</p></div>
  <div class="sc"><p class="who">Automa</p><ul class="r"><li>1 PV por IT: ${a.tr}</li><li>PV das peças de floresta: ${a.vp}</li><li>1 PV por prata restante: ${a.fin}</li></ul><p class="big">${bot} PV</p></div></div>
  <p class="tip">As regras do automa não preveem desempate: em caso de empate, a partida termina empatada.</p>
  <button class="go" id="again">Jogar de novo</button></section>`;
 }
 return `<section class="card"><h2>Fim do Jogo</h2>
 <p class="big ${win?"win":"lose"}">${win?"Você venceu!":"Você perdeu"}</p>
 <p class="tip">${win?"Marte está totalmente terraformado: todos os parâmetros atingiram o nível máximo.":`Ao final das 25 rodadas, Marte não estava totalmente terraformado. Faltaram ${left()} níveis.`}</p>
 <h2 style="margin-top:18px">Pontuação Final</h2>
 <p class="tip">Some seus PV e tente bater sua melhor pontuação na próxima partida.</p>
 ${inputs}<p class="tip">Inclua as cartas com PV variável (*).</p><p class="big" id="tot">${me} PV</p><button class="go" id="again">Jogar de novo</button></section>`;
}

const BOTD=["Ganha 1 cobre. Se tiver prata, gasta 1 para subir a produção.","Ganha 1 cobre e 1 peça de floresta (1 PV).","Ganha 1 cobre e gasta toda a prata no alvo, 1 nível por prata.","Ganha 1 cobre mais tantos cobres quanto a produção.","Ganha 1 cobre."];
const BOTI=()=>[`+1 ${IC.cu} · 1 ${IC.ag} ${IC.to} +1 ${IC.mc}`,`+1 ${IC.cu} · +1 ${IC.forest}`,`+1 ${IC.cu} · X ${IC.ag} ${IC.to} +X ${IC.temp}<span class="sl">/</span>${IC.o2}<span class="sl">/</span>${IC.ocean}`,`+(1 + ${IC.mc}) ${IC.cu}`,`+1 ${IC.cu}`];
function rulesView(){
 const tabs=[["rodada","Rodada"],["fases","Fases"],["automa","Automa"],["solo","Solo oficial"]];
 if(!S.rtab)S.rtab=AUT()?"automa":"rodada";
 const nav=`<div class="rtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" aria-selected="${S.rtab===k}" data-rt="${k}" class="${S.rtab===k?"sel":""}">${l}</button>`).join("")}</div>`;
 const cube=(k,n=1)=>`<span class="cb ${k}"></span>`.repeat(n);
 const flow=(arr)=>`<div class="flow">${arr.map((x,i)=>`<div class="fl"><span class="fn">${i+1}</span><div><h3>${x[0]}</h3><p>${x[1]}</p></div></div>`).join("")}</div>`;
 const phCard=(f,i,rows)=>`<details class="pc p${i}"><summary class="pch"><img src="${PHIMG[i]}" alt="Fase ${f.n}"><h3>${f.n} · ${f.t}</h3></summary>${rows.map(r=>`<div class="pcr"><span class="k ${r[2]||""}">${r[0]}</span><p>${r[1]}</p></div>`).join("")}</details>`;
 const srow=(ic,t)=>`<div class="srw"><span class="eqn">${ic}</span><span>${t}</span></div>`;
 const scoreYou=`<div class="scv"><p class="who">Você</p>${srow(`<b>1</b> PV × ${IC.it}`,"cada ponto de IT")}${srow(`<b>1</b> PV × ${IC.forest}`,"cada peça de floresta")}${srow(`<b>X</b> PV ${IC.card}`,"PV impresso nas cartas jogadas, inclusive os variáveis (*)")}</div>`;
 const scoreBot=`<div class="scv bt"><p class="who">Automa</p>${srow(`<b>1</b> PV × ${IC.it}`,"cada ponto de IT")}${srow(`<b>1</b> PV × ${IC.forest}`,"cada peça de floresta")}${srow(`<b>1</b> PV × ${IC.ag}`,"cada prata que sobrar na reserva")}</div>`;
 const goals=`<div class="goals"><div class="goal"><b>9/9</b>${IC.ocean}<small>oceanos</small></div><div class="goal"><b>+8 °C</b>${IC.temp}<small>temperatura</small></div><div class="goal"><b>14%</b>${IC.o2}<small>oxigênio</small></div></div>`;
 let body="";
 if(S.rtab==="rodada"){
  body=`<h2>Rodada</h2><p class="tip">Toque em cada parte para abrir.</p>
  <h3 style="margin-top:18px">Uma rodada em 4 etapas</h3>
  ${flow([["Você escolhe 1 fase","Toque numa carta de fase. Você não pode escolher a mesma fase em duas rodadas seguidas."],
   ["O automa revela 1 fase","O app tira a carta dele. Essa fase também acontece para você, mas <strong>sem bônus</strong>."],
   ["Resolvem-se as fases escolhidas","Sempre na ordem I → V. Fases que ninguém escolheu não acontecem."],
   ["Final de rodada","Fique com no máximo 10 cartas na mão; cada carta excedente descartada dá 3 M$."]])}
  <h3 style="margin-top:18px">Exemplo</h3>
  <div class="ex"><div class="exrow">${PH.map((f,i)=>`<div class="exc p${i} ${i===2?"you":i===0?"opp":"off"}"><img src="${PHIMG[i]}" alt="Fase ${f.n}"><span>${f.t.slice(0,5)}.</span></div>`).join("")}</div>
  <div class="legend"><span><i class="lg you"></i>sua escolha (com bônus)</span><span><i class="lg opp"></i>revelada pelo automa</span><span><i class="lg off"></i>não acontece</span></div>
  <p class="tip">Você escolheu <strong>III Ação</strong> e o automa revelou <strong>I Desenvolvimento</strong>. Nesta rodada acontecem só I e III, nessa ordem. Você faz as duas; o bônus vem só na III.</p>
  <p class="tip">Se os dois escolherem a <strong>mesma fase</strong>, ela é resolvida apenas uma vez.</p></div>
  <h3 style="margin-top:18px">A qualquer momento</h3>
  <div class="pills"><span class="pill">1 carta da mão → 3 M$</span><span class="pill">Aço: −2 M$ em carta de construção</span><span class="pill">Titânio: −3 M$ em carta espacial</span></div>`;
 }
 if(S.rtab==="fases"){
  const std=[[`8 ${IC.heat}`,`+1 ${IC.temp}`],[`14 ${IC.money}`,`+1 ${IC.temp}`],[`8 ${IC.plant}`,`+1 ${IC.forest} +1 ${IC.o2}`],[`20 ${IC.money}`,`+1 ${IC.forest} +1 ${IC.o2}`],[`15 ${IC.money}`,`+1 ${IC.ocean}`]];
  body=`<h2>As 5 fases</h2><p class="tip">Cada fase tem um efeito para todos e um bônus só para quem a escolheu.${AUT()?" A última linha mostra o que o automa faz.":""}</p>
  ${PH.map((f,i)=>phCard(f,i,[["Todos",f.short],["Bônus",f.bon,"bk"],...(AUT()?[["Automa",`${BOTD[i]}${BOTI()[i].split(" · ").map(x=>`<span class="icl2 bl">${x}</span>`).join("")}`,"ak"]]:[])])).join("")}
  <h3 style="margin-top:18px">Projetos-padrão (na fase III)</h3><p class="tip">Podem ser feitos quantas vezes você quiser.</p>
  <div class="conv">${std.map(x=>`<div class="cv ico"><span class="eqn">${x[0]}</span><span class="arr">→</span><span class="eqn">${x[1]}</span></div>`).join("")}</div>
  <p class="tip"><strong>Regra importante:</strong> no final da fase de ação, se você tiver calor ou plantas o suficiente para um projeto-padrão, deve fazê-lo quantas vezes puder, a menos que o parâmetro já esteja no máximo.</p>
  <h3 style="margin-top:18px">Marte</h3>
  <div class="conv"><div class="cv"><span>${IC.temp} Temperatura</span><strong>−30 a +8 °C (19 níveis)</strong></div>
  <div class="cv"><span>${IC.o2} Oxigênio</span><strong>0% a 14% (14 níveis)</strong></div>
  <div class="cv"><span>${IC.ocean} Oceanos</span><strong>9 peças</strong></div></div>
  <p class="tip">Cada nível que <strong>você</strong> sobe dá +1 ${IC.it}.</p>`;
 }
 if(S.rtab==="automa"){
  const deck=[["Desenv.",3,"var(--pc0)"],["Constr.",2,"linear-gradient(135deg,var(--pc1) 50%,var(--pc1b) 50%)"],["Ação",3,"var(--pc2)"],["Produção",3,"var(--pc3)"],["Pesq.",1,"var(--pc4)"],["Reativas",3,"var(--ink)"]];
  body=`<h2>Automa Híbrido</h2><p class="tip">Um rival sem cartas nem dinheiro. Ele junta <strong>cubos</strong>, aumenta a produção, terraforma Marte e marca pontos. Vence quem tiver mais PV.</p>
  <h3 style="margin-top:18px">A economia de cubos</h3>
  <div class="eco">
   <div class="ec"><div class="eqn"><b>+1</b>${IC.cu}</div><span>por fase revelada</span></div>
   <div class="ec"><div class="eqn"><b>5</b>${IC.cu}<span class="eqs">=</span><b>1</b>${IC.ag}</div></div>
   <div class="ec"><div class="eqn"><b>1</b>${IC.ag}${IC.to}<b>+1</b>${IC.mc}</div><small class="phx">fase I</small><div class="eqn"><b>1</b>${IC.ag}${IC.to}<b>+1</b>${IC.temp}<span class="sl">/</span>${IC.o2}<span class="sl">/</span>${IC.ocean}</div><small class="phx">fase III</small></div></div>
  <p class="tip">A <strong>produção</strong> dele fica na trilha de produção de M$: na fase IV ele ganha essa quantidade de cobres. Produção alta = mais prata = terraforma mais rápido.</p>
  <h3 style="margin-top:18px">O que ele faz em cada fase</h3>
  ${PH.map((f,i)=>phCard(f,i,[["Automa",`${BOTD[i]}${BOTI()[i].split(" · ").map(x=>`<span class="icl2 bl">${x}</span>`).join("")}`,"ak"]])).join("")}
  <p class="tip">Ele <strong>nunca</strong> ganha bônus de fase e pode repetir a mesma fase em rodadas seguidas.</p>
  <h3 style="margin-top:18px">O baralho dele (15 cartas)</h3>
  <div class="stackbar">${deck.map(d=>`<i style="flex:${d[1]};background:${d[2]}" title="${d[0]}"></i>`).join("")}</div>
  <div class="legend">${deck.map(d=>`<span><i class="lg" style="background:${d[2]}"></i>${d[0]} ×${d[1]}</span>`).join("")}</div>
  <p class="tip">Cada carta traz uma <strong>fase</strong> e um <strong>alvo</strong>: o parâmetro de Marte que ele sobe se houver fase de ação. Quando o baralho acaba, embaralhe o descarte para formar um novo.</p>
  <p class="tip"><strong>Cartas reativas:</strong> 12 cartas trazem uma fase fixa. As outras 3 não: a fase delas é decidida na hora em que a carta é revelada, conforme a situação do jogo. Se você usar o app, ele decide sozinho e mostra o resultado. Com as cartas impressas, siga a regra de cada uma:</p>
  <div class="react">
   <div class="rc"><h3>Espelho</h3><p>Joga a fase que <strong>você</strong> escolheu na rodada anterior. Você também a refaz, sem bônus. Na 1ª rodada, joga Produção.</p></div>
   <div class="rc"><h3>Oportunista</h3><p>Se tiver 1 prata ou mais, joga <strong>Ação</strong>. Se não tiver, joga <strong>Produção</strong>.</p></div>
   <div class="rc"><h3>Corrida</h3><p>Joga <strong>Ação</strong>. O alvo é o parâmetro de Marte mais atrasado, ou seja, o que percorreu a menor parte da sua trilha.</p></div></div>
  <h3 style="margin-top:18px">Como ele terraforma</h3>
  <div class="tfh"><span class="eqn"><b>1</b>${IC.ag}</span><span class="arr">→</span><span class="eqn"><b>+1</b><span class="nv">nível</span></span><span class="eqn"><b>+1</b>${IC.it}</span></div>
  <p class="tip" style="text-align:center;margin-top:6px">Na fase III, ele gasta <strong>toda a prata</strong>, sempre no alvo da carta.</p>
  <div class="cyc2" role="img" aria-label="Oxigênio, depois Temperatura, depois Oceano, depois volta ao Oxigênio">
   <div class="cyr"><span class="cyn">${IC.o2}<small>Oxigênio</small></span><span class="cya">→</span><span class="cyn">${IC.temp}<small>Temperatura</small></span><span class="cya">→</span><span class="cyn">${IC.ocean}<small>Oceano</small></span></div>
   <svg class="cyb" viewBox="0 0 300 34" preserveAspectRatio="none" aria-hidden="true"><path d="M262 2 V16 Q262 28 248 28 H52 Q38 28 38 16 V8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M32 12 L38 2 L44 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
   <p class="cyc-t">Alvo no máximo? Ele passa para o próximo.</p></div>
  <div class="exv"><p class="exh">Exemplo</p>
   <div class="exl"><span>Alvo</span><span class="eqn">${IC.temp}<b>+6 °C</b></span><span>·</span><span class="eqn"><b>3</b>${IC.ag}</span></div>
   <div class="exs"><span class="eqn"><b>1</b>${IC.ag}</span><span class="arr">→</span><span class="eqn"><b>+1</b>${IC.temp}</span><small>chega a +8 °C (máximo)</small></div>
   <div class="exs"><span class="eqn"><b>2</b>${IC.ag}</span><span class="arr">→</span><span class="eqn"><b>+2</b>${IC.ocean}</span><small>passa para Oceano</small></div>
   <div class="exs tot"><span>Total</span><span class="eqn"><b>+3</b>${IC.it}</span><span class="eqn"><b>+2</b>${IC.cu}</span><small>1 cobre por oceano</small></div></div>
  <div class="facts">
   <div class="fact"><span class="eqn"><b>+1</b>${IC.it}</span><span>por nível que ele sobe</span></div>
   <div class="fact"><span class="eqn">${IC.o2}<span class="no">${IC.forest}</span></span><span>sobe oxigênio <strong>sem</strong> ganhar floresta</span></div>
   <div class="fact"><span class="eqn">${IC.ocean}<span class="arr">→</span><b>+1</b>${IC.cu}</span><span>ignore a recompensa impressa</span></div>
   <div class="fact"><span class="eqn">${IC.cu}<span class="arr">↻</span></span><span>cobres que sobram ficam na reserva</span></div></div>
  <h3 style="margin-top:18px">Fim do Jogo</h3>
  ${goals}
  <p class="tip">Quando os três chegam ao máximo, por você ou pelo automa, termine a fase atual e vá para a pontuação final. As outras fases da rodada não acontecem. Não há limite de rodadas.</p>
  <h3 style="margin-top:18px">Pontuação Final</h3>
  <div class="scg">${scoreYou}${scoreBot}</div>
  <div class="win2">${IC.trophy}<span>Vence quem tiver mais PV. As regras do automa não preveem desempate.</span></div>
  <p class="credit">Automa Híbrido v0.6 por manufitoussi · <a href="https://github.com/manufitoussi/ares-solo-automa">regras originais</a> · CC BY-NC-SA 4.0 · esta adaptação segue a mesma licença</p>`;
 }
 if(S.rtab==="solo"){
  body=`<h2>Solo oficial</h2><p class="tip">O objetivo do modo solo é terraformar completamente Marte antes que o tempo acabe. Todas as regras do jogo são as mesmas, com as exceções abaixo.</p>
  <h3 style="margin-top:18px">Preparação</h3>
  <ol class="r"><li>Compre 3 cartas de corporação.</li><li>Compre 8 cartas de projeto.</li><li>Descarte quantas cartas de projeto quiser e compre a mesma quantidade.</li><li>Selecione 1 corporação e descarte as outras 2.</li><li>Separe as cartas de fase do oponente (mão marciana) e embaralhe-as viradas para baixo.</li><li>Coloque um cubo do oponente no espaço 1 da trilha de IT.</li><li>Escolha um nível de dificuldade: Novato, Avançado ou Especialista.</li></ol>
  <h3 style="margin-top:18px">Andamento do jogo</h3>
  <p class="tip">Depois de escolher sua carta de fase, revele a carta do topo da mão do automa. Essa fase também é jogada na rodada, sem bônus.</p>
  <p class="tip">Quando as 5 cartas da mão do automa forem jogadas, embaralhe-as de novo e avance o cubo do automa 1 espaço na trilha de IT. Quando o cubo chegar ao 5, jogue as cinco rodadas finais: nelas, você escolhe a ordem das cartas do automa. Ao todo são 25 rodadas.</p>
  <h3 style="margin-top:18px">Dificuldade</h3>
  <p class="tip">A dificuldade define quanta ajuda você recebe para terraformar. Toda vez que o cubo do automa avança (4 vezes por partida, ao fim das rodadas 5, 10, 15 e 20), você aumenta parâmetros de graça:</p>
  <div class="conv"><div class="cv col"><span>Novato</span><strong>Sempre que a mão do automa for reembaralhada, aumente em 2 o nível de oxigênio ou temperatura (8 níveis grátis na partida).</strong></div>
  <div class="cv col"><span>Avançado</span><strong>Sempre que a mão do automa for reembaralhada, aumente em 1 o nível de oxigênio ou temperatura (4 níveis grátis na partida).</strong></div>
  <div class="cv col"><span>Especialista</span><strong>Nenhum bônus é concedido</strong></div></div>
  <p class="tip">Esses aumentos <strong>não</strong> dão IT nem peças de floresta. Se você ainda não tem experiência com o jogo, comece no Novato.</p>
  <h3 style="margin-top:18px">Fim do Jogo</h3>
  <div class="goals one"><div class="goal"><b>25</b><span class="rd">rodadas</span><small>5 mãos do automa</small></div></div>
  <p class="tip">A partida termina depois da rodada 25. Se Marte ficar totalmente terraformado antes, termine a fase atual e vá para a pontuação final.</p>
  <h3 style="margin-top:18px">Pontuação Final</h3>
  ${goals}
  <div class="win2">${IC.trophy}<span>Os três no máximo: <strong>você ganha</strong>. Caso contrário, você perde.</span></div>
  <p class="tip">Depois, some seus PV e tente bater seu recorde:</p>
  ${scoreYou}`;
 }
 const H='<h3 style="margin-top:18px">',parts=body.split(H);
 body=parts[0]+parts.slice(1).map(x=>{const k=x.indexOf("</h3>");return `<details class="sec"><summary><h3>${x.slice(0,k)}</h3></summary><div class="sb">${x.slice(k+5)}</div></details>`}).join("");
 return `<section class="card">${nav}<div class="rtools"><button id="xall">Abrir tudo</button></div><div style="margin-top:4px">${body}</div></section>`;
}

function draw(){
 const s=S.screen,body=showRules?rulesView():s==="setup"?setup():s==="choose"?choose():s==="pick"?pickCard():s==="resolve"?(AUT()?resolveBot():resolveSolo()):s==="bonus"?bonus():over();
 app.innerHTML=`<header class="top"><h1>Terraforming Mars: Ares Expedition</h1></header>${showRules||S.screen==="setup"?"":mars()+botBoard()}${body}`;
 document.getElementById("tgame").classList.toggle("on",!showRules);document.getElementById("rules").classList.toggle("on",showRules);
 document.getElementById("tgame").setAttribute("aria-current",showRules?"false":"page");document.getElementById("rules").setAttribute("aria-current",showRules?"page":"false");
 const u=document.getElementById("undo");u.hidden=showRules||S.screen==="setup"||S.screen==="over";u.disabled=!hist.length;
 const tot=document.getElementById("tot");
 ["ftr","ffo","fca"].forEach(id=>{const e=document.getElementById(id);if(e)e.oninput=()=>{const k={ftr:"tr",ffo:"forest",fca:"cards"}[id];S[k]=parseInt(e.value)||0;save();
  const me=S.tr+S.forest+S.cards;tot.textContent=me+" PV";
  const r=document.getElementById("res");if(r){const b=S.a.tr+S.a.vp+S.a.fin;r.textContent=me>b?"Você venceu!":me<b?"O automa venceu":"Empate";r.className="big "+(me>b?"win":me<b?"lose":"")}}});
}

function bump(k,d,tr){
 const lim={temp:[-30,8,2],o2:[0,14,1],oc:[0,9,1],tr:[0,99,1],forest:[0,99,1]}[k];
 const v=S[k]+d*lim[2];if(v<lim[0]||v>lim[1])return false;
 S[k]=v;if(tr&&["temp","o2","oc"].includes(k))S.tr=Math.max(0,S.tr+d);return true;
}
function endGame(){S.a.fin=AUT()?ag(S.a.c):0;S.screen="over"}

app.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.p)return set(()=>bump(d.p,+d.d,true));
 if(d.a)return set(()=>{S.a[d.a]=Math.max(d.a==="eng"?1:0,S.a[d.a]+ +d.d)});
 if(d.mode)return set(()=>S.mode=d.mode);
 if(d.diff)return set(()=>S.diff=d.diff);
 if(d.lvl)return set(()=>S.lvl=+d.lvl);
 if(d.src)return set(()=>S.deckSrc=d.src);
 if(b.id==="start")return set(()=>{S.a.eng=S.lvl;S.screen="choose"});
 if(d.ch!==undefined){const i=+d.ch,now=Date.now(),dbl=lastTap.i===i&&now-lastTap.t<450&&S.choice===i;lastTap={i,t:now};
  if(dbl){lastTap={i:-1,t:0};return set(doLock)}
  return set(()=>S.choice=i)}
 if(b.id==="lock")return set(doLock);
 if(d.dm!==undefined)return set(()=>pickDummy(+d.dm));
 if(d.cd)return set(()=>takeCard(+d.cd));
 if(b.id==="phdone")return set(()=>{const i=S.queue[S.qi];S.msg.push([i,botPhase(i)]);S.qi++;if(done())endGame()});
 if(b.id==="next")return set(()=>{
  S.last=S.choice;S.choice=null;S.rsOpen={};S.dummy=null;S.done={};S.card=null;S.msg=[];
  if(done()||(!AUT()&&S.round===25)){endGame();return}
  S.round++;
  if(!AUT()&&S.remain.length===0){S.remain=[0,1,2,3,4];S.bonusLeft=DIFF[S.diff].s;S.screen="bonus"}else S.screen="choose"});
 if(d.bn)return set(()=>{if(S.bonusLeft>0&&bump(d.bn,1,false))S.bonusLeft--});
 if(b.id==="bdone")return set(()=>{S.bonusLeft=0;S.screen="choose"});
 if(b.id==="again"){snap();const m=S.mode,l=S.lvl,df=S.diff,src=S.deckSrc;S=fresh();Object.assign(S,{mode:m,lvl:l,diff:df,deckSrc:src});save();draw();return}
 if(b.id==="xall"){const ds=[...app.querySelectorAll("section.card details")],open=!ds.every(x=>x.open);ds.forEach(x=>x.open=open);b.textContent=open?"Fechar tudo":"Abrir tudo";return}
 if(b.id==="mtog"||b.id==="ptog")return set(()=>S.showMars=!S.showMars);
 if(d.rs!==undefined)return set(()=>{S.rsOpen=S.rsOpen||{};S.rsOpen[d.rs]=!S.rsOpen[d.rs]});
 if(b.id==="prtog")return set(()=>S.prepClosed=!S.prepClosed);
 if(b.id==="atog")return set(()=>S.showBot=!S.showBot);
 if(b.id==="score")return set(()=>S.showScore=!S.showScore);
 if(d.rt){S.rtab=d.rt;save();draw();return}
});
let lastTap={i:-1,t:0};
function doLock(){
 if(AUT()){if(S.deckSrc==="app"){if(!S.deck.length)S.deck=shuffle(CARDS.map(c=>c[0]));takeCard(S.deck[S.deck.length-1])}else S.screen="pick";return}
 if(hand()<5&&S.deckSrc==="app")pickDummy(S.remain[Math.floor(Math.random()*S.remain.length)]);else S.screen="pick";
}
function pickDummy(i){S.dummy=i;S.remain=S.remain.filter(x=>x!==i);S.done={};S.screen="resolve"}
app.addEventListener("change",e=>{const c=e.target;if(c.dataset.dn!==undefined){snap();S.done[c.dataset.dn]=c.checked;save();draw()}});
document.getElementById("undo").onclick=()=>{if(hist.length){S=JSON.parse(hist.pop());save();showRules=false;draw()}};
document.getElementById("rules").onclick=()=>{if(showRules)return;showRules=true;S.rtab=null;draw();scrollTo(0,0)};
document.getElementById("tgame").onclick=()=>{if(!showRules)return;showRules=false;draw();scrollTo(0,0)};
let armed=false;
document.getElementById("reset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Tem certeza?";setTimeout(()=>{armed=false;e.target.textContent="Nova partida"},2500);return}
 armed=false;e.target.textContent="Nova partida";snap();S=fresh();save();showRules=false;draw()};
draw();
}
</script>
</body>
</html>
